[package]
name = "concord-steelman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Steelman engine for the concord workspace — produces the strongest good-faith version of each stance"

[lints]
workspace = true

[dependencies]
concord-corpus = { path = "../concord-corpus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

[dev-dependencies]
tempfile = "3"
