[package]
name = "concord-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "CLI entry point for the concord workspace"

[lints]
workspace = true

[[bin]]
name = "concord"
path = "src/main.rs"

[dependencies]
concord-corpus = { path = "../concord-corpus" }
concord-steelman = { path = "../concord-steelman" }
concord-cruxes = { path = "../concord-cruxes" }
concord-deescalate = { path = "../concord-deescalate" }
# CLI parsing
clap = { version = "4", features = ["derive"] }
# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SIGPIPE handling
sigpipe = "0.1"
# Error handling
anyhow = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
