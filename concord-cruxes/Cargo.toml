[package]
name = "concord-cruxes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Crux separator for the concord workspace — maps disagreements into shared values, cruxes, and misunderstandings"

[lints]
workspace = true

[dependencies]
concord-corpus = { path = "../concord-corpus" }
concord-steelman = { path = "../concord-steelman" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
